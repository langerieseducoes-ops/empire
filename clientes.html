<section class="painel">


<h2>
Cadastro de Cliente
</h2>



<div class="formulario">



<input 
type="text"
id="nomeCliente"
placeholder="Nome do cliente">



<input 
type="text"
id="telefoneCliente"
placeholder="Telefone">



<input 
type="text"
id="whatsappCliente"
placeholder="WhatsApp">



<input 
type="text"
id="cpfCliente"
placeholder="CPF">



<input 
type="text"
id="cidadeCliente"

<input 
type="text"
id="enderecoCliente"
placeholder="Endereço">

id="observacaoCliente"
placeholder="Observação">
</textarea>

</button>
