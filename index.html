<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Empire ERP Premium</title>

<link rel="icon"
href="assets/img/favicon.png">

<link rel="stylesheet"
href="assets/css/style.css">

<link rel="stylesheet"
href="assets/css/login.css">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body class="login-page">

<div class="background-login"></div>

<div class="overlay-login"></div>

<div class="login-container">

<div class="login-card">

<div class="logo-login">

<img
src="assets/img/logo.png"
alt="Empire ERP">

<h1>EMPIRE</h1>

<p>Império da Moda Online</p>

</div>

<h2>

Bem-vindo

</h2>

<p class="subtitulo-login">

Entre para acessar o sistema.

</p>
<!-- =====================================================
     FORMULÁRIO DE LOGIN
===================================================== -->

<form id="formLogin" class="login-form">

    <div class="campo-login">

        <label>Usuário</label>

        <input
            type="text"
            id="usuario"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required>

    </div>

    <div class="campo-login">

        <label>Senha</label>

        <div class="senha-box">

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required>

            <button
                type="button"
                class="btn-mostrar-senha"
                onclick="mostrarSenha()">

                👁

            </button>

        </div>

    </div>

    <div class="opcoes-login">

        <label class="lembrar">

            <input
                type="checkbox"
                id="lembrar">

            Lembrar-me

        </label>

        <a
            href="#"
            onclick="recuperarSenha(); return false;">

            Esqueci minha senha

        </a>

    </div>

    <button
        type="submit"
        class="btn-login">

        Entrar

    </button>

</form>
<!-- =====================================================
     INFORMAÇÕES DO SISTEMA
===================================================== -->

<div class="login-info">

    <div class="info-item">

        <span>🏢 Empresa</span>

        <strong id="nomeEmpresa">

            Empire - Império da Moda Online

        </strong>

    </div>

    <div class="info-item">

        <span>💻 Sistema</span>

        <strong>

            Empire ERP Premium Remaster

        </strong>

    </div>

    <div class="info-item">

        <span>📦 Versão</span>

        <strong id="versaoSistema">

            v2.0.0

        </strong>

    </div>

</div>

<div class="login-status">

    <span id="statusLogin">

        Pronto para autenticação

    </span>

</div>
<!-- =====================================================
     RODAPÉ
===================================================== -->

<footer class="login-footer">

    <p>

        © <span id="anoAtual"></span>

        Empire ERP Premium Remaster

    </p>

    <small>

        Gestão Inteligente para Moda

    </small>

</footer>

</div>

</div>

<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="assets/js/empresa.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/login.js"></script>

<script>
    document.getElementById("anoAtual").textContent =
        new Date().getFullYear();
</script>

</body>
</html>
