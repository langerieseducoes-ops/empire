<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Empire – Império da Moda Online</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
<link rel="stylesheet" href="style.css">

<script src="js/empresa.js"></script>

</head>

<body class="login">

<div class="overlay"></div>

<div class="login-box">

    <img src="img/logo.png" class="logo">

    <h1>EMPIRE</h1>

    <h3>Império da Moda Online</h3>

    <input
        type="text"
        id="usuario"
        placeholder="Usuário">

    <input
        type="password"
        id="senha"
        placeholder="Senha">

    <button onclick="entrar()">
        ENTRAR
    </button>

    <p class="versao">
        Versão 1.0
    </p>

</div>

<script src="js/login.js"></script>

</body>

</html>
